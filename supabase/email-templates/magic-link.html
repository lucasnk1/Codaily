<!--
  Cole isso no painel do Supabase em:
  Authentication → Email Templates → Magic Link
  (substitua o conteúdo do campo "Message body")

  As variáveis {{ .ConfirmationURL }} etc são do próprio Supabase (Go templates)
  — não mude os nomes delas, só o layout ao redor.
-->
<div style="background-color:#0D0F12;padding:40px 16px;font-family:'Courier New',monospace;">
  <table role="presentation" width="100%" style="max-width:440px;margin:0 auto;border-collapse:collapse;">
    <tr>
      <td style="padding-bottom:28px;text-align:center;">
        <span style="font-size:22px;font-weight:700;color:#E5E7EB;">
          <span style="color:#6366F1;">&lt;/&gt;</span> Codaily
        </span>
      </td>
    </tr>
    <tr>
      <td style="background-color:#16191E;border:1px solid #2A2E37;border-radius:12px;padding:32px 28px;">
        <p style="margin:0 0 8px;color:#E5E7EB;font-size:18px;font-weight:600;">
          Seu link de acesso chegou
        </p>
        <p style="margin:0 0 24px;color:#9CA3AF;font-size:14px;line-height:1.6;">
          Clique no botão abaixo para entrar no Codaily. Esse link expira em breve e só funciona uma vez.
        </p>
        <table role="presentation" width="100%" style="border-collapse:collapse;">
          <tr>
            <td align="center">
              <a href="{{ .ConfirmationURL }}"
                 style="display:inline-block;background-color:#6366F1;color:#ffffff;text-decoration:none;
                        font-size:14px;font-weight:600;padding:12px 28px;border-radius:8px;">
                Entrar no Codaily
              </a>
            </td>
          </tr>
        </table>
        <p style="margin:24px 0 0;color:#6B7280;font-size:12px;line-height:1.6;">
          Se você não pediu esse link, pode ignorar este e-mail com segurança.
        </p>
      </td>
    </tr>
    <tr>
      <td style="padding-top:24px;text-align:center;">
        <p style="margin:0;color:#6B7280;font-size:11px;">
          Codaily — jogos diários de lógica para devs
        </p>
      </td>
    </tr>
  </table>
</div>
